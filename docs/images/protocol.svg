<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; }
    .accent { fill: #ddf4ff; stroke: #54aeff; }
    .soft { fill: none; stroke: #d0d7de; stroke-dasharray: 5 4; }
    .title { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .text { fill: #59636e; font-size: 12.5px; }
    .code { fill: #0969da; font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .label { fill: #59636e; font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .number { fill: #0969da; font-size: 13px; font-weight: 700; }
    .arrow { stroke: #8c959f; stroke-width: 1.6; fill: none; }
    .life { stroke: #d0d7de; stroke-width: 1.4; stroke-dasharray: 4 4; fill: none; }
    .head { fill: #8c959f; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #30363d; }
      .accent { fill: #0c2d4b; stroke: #1f6feb; }
      .soft { stroke: #30363d; }
      .title { fill: #e6edf3; }
      .text { fill: #9198a1; }
      .code { fill: #4493f8; }
      .label { fill: #9198a1; }
      .number { fill: #4493f8; }
      .arrow { stroke: #6e7681; }
      .life { stroke: #30363d; }
      .head { fill: #6e7681; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="880" height="560" rx="12"/>
  <rect class="accent" x="190" y="20" width="140" height="44" rx="10" stroke-width="1.4"/>
  <text class="title" x="260" y="47" text-anchor="middle">Host</text>
  <rect class="box" x="590" y="20" width="140" height="44" rx="10" stroke-width="1.2"/>
  <text class="title" x="660" y="47" text-anchor="middle">Plugin</text>
  <path class="life" d="M260,64 V530"/>
  <path class="life" d="M660,64 V530"/>

  <text class="title" x="24" y="104">Who are you?</text>
  <text class="text" x="24" y="122">once</text>
  <path class="arrow" d="M262,100 H656" marker-end="url(#arrow)"/>
  <text class="code" x="459" y="92" text-anchor="middle">describe</text>
  <path class="arrow" d="M656,136 H262" marker-end="url(#arrow)"/>
  <text class="code" x="459" y="128" text-anchor="middle">description {name, version, rules}</text>
  <text class="title" x="24" y="186">Set up the rules</text>
  <text class="text" x="24" y="204">once per rule instance</text>
  <path class="arrow" d="M262,182 H656" marker-end="url(#arrow)"/>
  <text class="code" x="459" y="174" text-anchor="middle">attach {instance, rule, parameters}</text>
  <path class="arrow" d="M656,218 H262" marker-end="url(#arrow)"/>
  <text class="code" x="459" y="210" text-anchor="middle">attached {instance}</text>
  <text class="title" x="24" y="268">Here is the world</text>
  <text class="text" x="24" y="286">what its rules read,</text>
  <text class="text" x="24" y="303">and the last events</text>
  <path class="arrow" d="M262,264 H656" marker-end="url(#arrow)"/>
  <text class="code" x="459" y="256" text-anchor="middle">start {snapshot}</text>
  <path class="arrow" d="M656,300 H262" marker-end="url(#arrow)"/>
  <text class="code" x="459" y="292" text-anchor="middle">changes</text>
  <rect class="soft" x="178" y="330" width="560" height="120" rx="10" stroke-width="1.3"/>
  <text class="label" x="190" y="348">again and again</text>
  <text class="title" x="24" y="380">Step</text>
  <text class="text" x="24" y="398">the rules due now, and</text>
  <text class="text" x="24" y="415">the changes it missed</text>
  <path class="arrow" d="M262,384 H656" marker-end="url(#arrow)"/>
  <text class="code" x="459" y="376" text-anchor="middle">step {stage, time, step, instances, incoming}</text>
  <path class="arrow" d="M656,428 H262" marker-end="url(#arrow)"/>
  <text class="code" x="459" y="420" text-anchor="middle">changes {time, changes} + float32 fields</text>
  <text class="title" x="24" y="486">Done</text>
  <path class="arrow" d="M262,482 H656" marker-end="url(#arrow)"/>
  <text class="code" x="459" y="474" text-anchor="middle">stop</text>
  <text class="text" x="660" y="512" text-anchor="middle">the plugin exits</text>
  <text class="text" x="760" y="140">any answer can be</text>
  <text class="code" x="760" y="158">error {message}</text>
  <text class="text" x="760" y="176">and the run stops</text>
</svg>
