<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; }
    .accent { fill: #ddf4ff; stroke: #54aeff; }
    .soft { fill: none; stroke: #d0d7de; stroke-dasharray: 5 4; }
    .title { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .text { fill: #59636e; font-size: 12.5px; }
    .code { fill: #0969da; font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .label { fill: #59636e; font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .number { fill: #0969da; font-size: 13px; font-weight: 700; }
    .arrow { stroke: #8c959f; stroke-width: 1.6; fill: none; }
    .life { stroke: #d0d7de; stroke-width: 1.4; stroke-dasharray: 4 4; fill: none; }
    .head { fill: #8c959f; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #30363d; }
      .accent { fill: #0c2d4b; stroke: #1f6feb; }
      .soft { stroke: #30363d; }
      .title { fill: #e6edf3; }
      .text { fill: #9198a1; }
      .code { fill: #4493f8; }
      .label { fill: #9198a1; }
      .number { fill: #4493f8; }
      .arrow { stroke: #6e7681; }
      .life { stroke: #30363d; }
      .head { fill: #6e7681; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="880" height="330" rx="12"/>
  <rect class="box" x="24" y="30" width="190" height="104" rx="10" stroke-width="1.2"/>
  <text class="number" x="40" y="58">1</text>
  <text class="title" x="60" y="58">Read</text>
  <text class="text" x="40" y="86">includes merged, paths</text>
  <text class="text" x="40" y="104">from the file's folder</text>
  <rect class="box" x="240" y="30" width="190" height="104" rx="10" stroke-width="1.2"/>
  <text class="number" x="256" y="58">2</text>
  <text class="title" x="276" y="58">Check</text>
  <text class="text" x="256" y="86">every mistake listed at</text>
  <text class="text" x="256" y="104">once, before anything</text>
  <text class="text" x="256" y="122">starts</text>
  <rect class="box" x="456" y="30" width="190" height="104" rx="10" stroke-width="1.2"/>
  <text class="number" x="472" y="58">3</text>
  <text class="title" x="492" y="58">Plugins</text>
  <text class="text" x="472" y="86">started, described; every</text>
  <text class="text" x="472" y="104">rule must exist; attach</text>
  <rect class="box" x="672" y="30" width="190" height="104" rx="10" stroke-width="1.2"/>
  <text class="number" x="688" y="58">4</text>
  <text class="title" x="708" y="58">Anchors</text>
  <text class="text" x="688" y="86">added to the world as</text>
  <text class="text" x="688" y="104">hidden entities</text>
  <rect class="accent" x="672" y="196" width="190" height="104" rx="10" stroke-width="1.2"/>
  <text class="number" x="688" y="224">5</text>
  <text class="title" x="708" y="224">Start</text>
  <text class="text" x="688" y="252">each plugin gets what it</text>
  <text class="text" x="688" y="270">reads, in the file's order</text>
  <rect class="accent" x="456" y="196" width="190" height="104" rx="10" stroke-width="1.2"/>
  <text class="number" x="472" y="224">6</text>
  <text class="title" x="492" y="224">Stages</text>
  <text class="text" x="472" y="252">clocks move; rules run</text>
  <text class="text" x="472" y="270">every step, every N or</text>
  <text class="text" x="472" y="288">once; toggle keys</text>
  <rect class="accent" x="240" y="196" width="190" height="104" rx="10" stroke-width="1.2"/>
  <text class="number" x="256" y="224">7</text>
  <text class="title" x="276" y="224">Results</text>
  <text class="text" x="256" y="252">objectives checked;</text>
  <text class="text" x="256" y="270">snapshots and events,</text>
  <text class="text" x="256" y="288">or the live scene</text>
  <path class="arrow" d="M214,82 H236" marker-end="url(#arrow)"/>
  <path class="arrow" d="M430,82 H452" marker-end="url(#arrow)"/>
  <path class="arrow" d="M646,82 H668" marker-end="url(#arrow)"/>
  <path class="arrow" d="M767,134 V192" marker-end="url(#arrow)"/>
  <path class="arrow" d="M672,248 H650" marker-end="url(#arrow)"/>
  <path class="arrow" d="M456,248 H434" marker-end="url(#arrow)"/>
  <text class="label" x="24" y="226">rules.yaml</text>
  <text class="text" x="24" y="246">is only data: the</text>
  <text class="text" x="24" y="263">host does the rest</text>
  <text class="label" x="256" y="160">a mistake → nothing starts</text>
</svg>
